name: SP-PROD1 normative engineering
on:
  push:
    branches: [feat/sp-prod1-normative-engineering]
concurrency:
  group: sp-prod1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engineering:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_sp_prod1_engineering.py -v
      - run: python -m unittest discover -s tests -p test_mc_r1_engineering.py -v
