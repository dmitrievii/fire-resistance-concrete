name: SP-R11E targeted limit reconciliation
on:
  push:
    branches: [feat/sp-r11e-limit-reconciliation]
concurrency:
  group: sp-r11e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reconciliation:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Targeted limit reconciliation
        run: python -m unittest discover -s tests -p test_sp_r11e_reconciliation.py -v
