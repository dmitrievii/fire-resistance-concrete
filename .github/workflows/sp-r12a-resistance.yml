name: SP-R12A resistance evidence and targeted history
on:
  push:
    branches: [feat/sp-r12a-resistance-extraction]
concurrency:
  group: sp-r12a-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p test_sp_r12a_evidence.py -v
  targeted-history:
    if: ${{ !contains(github.event.head_commit.message, '[evidence-only]') }}
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_sp_r12a_actual.py -v
