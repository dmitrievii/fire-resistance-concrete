name: SP-R12D practical qualification
on:
  push:
    branches: [feat/sp-r12d-practical-qualification]
jobs:
  practical:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_sp_r12d_practical.py -v
