name: MC-R1 source replay and practical engineering candidate
on:
  push:
    branches: [feat/mc-r1-engineering-reconciliation]
jobs:
  engineering:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_mc_r1_engineering.py -v
