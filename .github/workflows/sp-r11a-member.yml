name: SP-R11A targeted member verification
on:
  push:
    branches: [feat/sp-r11a-history-member]
jobs:
  member-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Targeted member verification
        run: python -m unittest discover -s tests -p test_sp_r11a_history_member.py -v
