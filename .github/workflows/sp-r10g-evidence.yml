name: SP-R10G evidence-only targeted verification
on:
  push:
    branches: [feat/sp-r10g-evidence-consolidation]
jobs:
  evidence-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Evidence-only tests (no numerical campaigns)
        run: python -m unittest discover -s tests -p test_sp_r10g_evidence.py -v
