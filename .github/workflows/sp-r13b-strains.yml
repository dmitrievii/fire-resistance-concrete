name: SP-R13B targeted strain qualification
on:
  push:
    branches: [feat/sp-r13b-strain-qualification]
jobs:
  strain-qualification:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_sp_r13b_strains.py -v
