name: SP-R11C targeted continuation verification
on:
  push:
    branches: [feat/sp-r11c-limit-continuation]
jobs:
  continuation-tests:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Targeted continuation tests
        run: python -m unittest discover -s tests -p test_sp_r11c_continuation.py -v
