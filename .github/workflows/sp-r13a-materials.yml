name: SP-R13A targeted constitutive verification
on:
  push:
    branches: [feat/sp-r13a-constitutive-closure]
jobs:
  materials:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: |
          cd tests
          PYTHONPATH=.. python -m unittest -v test_sp_r13a_normative test_sp_r5_physical_and_global.TestSP5PhysicalSourceConstitutive.test_source_complete_rising_steel_is_continuous_and_strain_bounded
